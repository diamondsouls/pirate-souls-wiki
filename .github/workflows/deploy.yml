name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel an in-flight deploy when a new push lands; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Warn if EDIT_SERVICE_URL is unset
        if: vars.EDIT_SERVICE_URL == ''
        run: echo "::warning::EDIT_SERVICE_URL repo variable is empty. The build will fall back to http://localhost:8000 and 'Edit this page' links will be broken. Set it under Settings → Secrets and variables → Actions → Variables."
      - name: Build
        env:
          EDIT_SERVICE_URL: ${{ vars.EDIT_SERVICE_URL }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
